name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install the DMG builder
        # dmgbuild writes the volume's .DS_Store in pure Python, so the styled
        # installer window needs no Finder — which a runner has no session for.
        run: python3 -m pip install --break-system-packages dmgbuild

      - name: Cache the mihomo core
        uses: actions/cache@v4
        with:
          path: Resources/mihomo
          key: mihomo-${{ hashFiles('scripts/fetch-mihomo.sh') }}

      - name: Cache the geodata
        uses: actions/cache@v4
        with:
          path: Resources/geodata
          key: geodata-${{ hashFiles('scripts/fetch-geodata.sh') }}

      - name: Fetch the core
        # The suite starts it for real, so this is not optional here.
        run: scripts/fetch-mihomo.sh

      - name: Fetch the geodata
        # The suite has the core load GEOSITE and GEOIP rules from these with
        # the download unreachable, which without them it would only skip.
        run: scripts/fetch-geodata.sh

      - name: Test
        run: swift run moonlight-tests

      - name: Build the app bundle
        run: scripts/build-app.sh
