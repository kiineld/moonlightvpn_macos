name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Cache the mihomo core
        uses: actions/cache@v4
        with:
          path: Resources/mihomo
          key: mihomo-${{ hashFiles('scripts/fetch-mihomo.sh') }}

      - name: Fetch the core
        # The suite starts it for real, so this is not optional here.
        run: scripts/fetch-mihomo.sh

      - name: Test
        run: swift run moonlight-tests

      - name: Build the app bundle
        run: scripts/build-app.sh
