name: Release

# Tag to cut a release:  git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (without the leading v)"
        required: true

permissions:
  contents: write

jobs:
  build:
    # Both slices come off one runner: `swift build --arch arm64 --arch x86_64`
    # needs full Xcode, which the GitHub images have and the Command Line Tools
    # do not.
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: universal
            label: universal
          - arch: arm64
            label: apple-silicon
          - arch: x86_64
            label: intel

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "$version" > VERSION

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Cache the mihomo core
        uses: actions/cache@v4
        with:
          path: Resources/mihomo
          key: mihomo-${{ hashFiles('scripts/fetch-mihomo.sh') }}

      - name: Cache the fonts
        uses: actions/cache@v4
        with:
          path: Resources/fonts
          key: fonts-${{ hashFiles('scripts/fetch-fonts.sh') }}

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ matrix.arch }}-${{ hashFiles('Package.resolved') }}

      - name: Test
        # The suite runs the real core, so it only has to pass once — but it is
        # cheap and catches a bad core download per architecture.
        run: |
          scripts/fetch-mihomo.sh
          swift run moonlight-tests

      - name: Build
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
          TELEGRAM_BOT_URL: ${{ vars.TELEGRAM_BOT_URL }}
          TELEGRAM_CHANNEL_URL: ${{ vars.TELEGRAM_CHANNEL_URL }}
          SUPPORT_URL: ${{ vars.SUPPORT_URL }}
        run: scripts/build-app.sh

      - name: Verify the slices the bundle claims to have
        run: |
          set -e
          for binary in Contents/MacOS/Moonlight Contents/Resources/moonlight-helper Contents/Resources/mihomo; do
            echo "── $binary"
            lipo -info "build/Moonlight.app/$binary"
          done
          # A universal build that quietly produced one slice would install fine
          # and then fail to launch on the other architecture.
          if [ "${{ matrix.arch }}" = "universal" ]; then
            lipo -info build/Moonlight.app/Contents/MacOS/Moonlight | grep -q "x86_64 arm64"
          fi

      - name: Package
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/make-dmg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: moonlight-${{ matrix.arch }}
          path: |
            build/*.dmg
            build/*.dmg.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            echo "## Downloads"
            echo
            echo "| Mac | File |"
            echo "|---|---|"
            echo "| Any (Intel + Apple silicon) | \`Moonlight-universal.dmg\` |"
            echo "| Apple silicon only | \`Moonlight-arm64.dmg\` |"
            echo "| Intel only | \`Moonlight-x86_64.dmg\` |"
            echo
            echo "The universal build runs everywhere; the per-architecture builds are"
            echo "about half the size."
            echo
            echo "### First launch"
            echo
            echo "The app is **not notarised**, so Gatekeeper refuses it on first open."
            echo "Right-click the app in Applications and choose *Open*, or run:"
            echo
            echo '```bash'
            echo 'xattr -dr com.apple.quarantine /Applications/Moonlight.app'
            echo '```'
            echo
            echo "### Checksums"
            echo
            echo '```'
            cat artifacts/*.sha256 | sed 's|artifacts/||'
            echo '```'
          } > notes.md

          gh release create "$GITHUB_REF_NAME" \
            --title "Moonlight $version" \
            --notes-file notes.md \
            artifacts/*.dmg artifacts/*.dmg.sha256
